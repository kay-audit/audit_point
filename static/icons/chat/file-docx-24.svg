<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <!-- Document body with folded top-right corner -->
  <path d="M5 2.5h10l4 4v15h-14v-19z"/>
  <!-- Folded corner -->
  <path d="M15 2.5v4h4"/>
  <!-- docx label; textLength фиксирует ширину подписи (внутренняя ширина
       корпуса — 12.5), иначе четыре буквы упираются в обводку и разъезжаются
       на системах, где вместо Arial подставится другой шрифт -->
  <text x="12" y="15.5" font-family="Arial, Helvetica, sans-serif" font-size="5" font-weight="700" fill="currentColor" stroke="none" text-anchor="middle" textLength="11" lengthAdjust="spacingAndGlyphs">docx</text>
</svg>