<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
  <!-- WinRAR: 2 книги (малиновая/синяя), перетянутые кожаным ремнём
       с металлической пряжкой; плоский дизайн без 3D-верха -->

  <!-- Малиновая книга (верхняя) -->
  <rect x="4" y="5" width="16" height="7.5" fill="#B83A8A" stroke="#000" stroke-width="0.6" stroke-linejoin="round"/>

  <!-- Синяя книга (нижняя) -->
  <rect x="4" y="12.5" width="16" height="7.5" fill="#1E3F8C" stroke="#000" stroke-width="0.6" stroke-linejoin="round"/>

  <!-- Коричневый ремень по переду стопки -->
  <rect x="11" y="5" width="2" height="15" fill="#6B3F1D" stroke="#000" stroke-width="0.6"/>

  <!-- Хвостик ремня снизу -->
  <path d="M11 20 L13 20 L13 22.5 L11 22.5 Z" fill="#6B3F1D" stroke="#000" stroke-width="0.5" stroke-linejoin="round"/>

  <!-- Металлическая пряжка -->
  <rect x="9.5" y="10.5" width="5" height="3" rx="0.4" fill="#A8A8A8" stroke="#000" stroke-width="0.5"/>
  <rect x="11.3" y="11" width="1.4" height="2" fill="#5A5A5A" stroke="#000" stroke-width="0.3"/>

  <!-- Жёлтые декоративные метки "II" на корешках -->
  <line x1="7" y1="7.5" x2="8.5" y2="7.5" stroke="#F4D03F" stroke-width="0.7" stroke-linecap="round"/>
  <line x1="7" y1="8.8" x2="8.5" y2="8.8" stroke="#F4D03F" stroke-width="0.7" stroke-linecap="round"/>
  <line x1="7" y1="15" x2="8.5" y2="15" stroke="#F4D03F" stroke-width="0.7" stroke-linecap="round"/>
  <line x1="7" y1="16.3" x2="8.5" y2="16.3" stroke="#F4D03F" stroke-width="0.7" stroke-linecap="round"/>
</svg>
