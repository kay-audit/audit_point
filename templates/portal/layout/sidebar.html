<!-- Общий sidebar для landing и acts-manager страниц -->
<aside class="landing-sidebar" id="landingSidebar">
    <!-- Кнопка первая, логотипа нет: в свёрнутом рельсе на его месте всё равно
         оказывается стрелка, и при разворачивании они менялись местами -->
    <div class="sidebar-header">
        <button class="sidebar-toggle-btn" id="sidebarToggleBtn" title="Свернуть/развернуть">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                <path d="M15 19l-7-7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
        <h1 class="sidebar-title">Инструменты</h1>
    </div>

    <nav class="sidebar-nav">
        <!-- Единое рабочее место (всегда первый, хардкод) -->
        <a href="/" class="sidebar-nav-item {{ 'active' if active_page == 'landing' else '' }}">
            <svg class="sidebar-nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none">
                <path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1m-2 0h2"
                      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="sidebar-nav-label">Единое рабочее место</span>
        </a>

        {% if is_admin %}
        <a href="/admin" class="sidebar-nav-item {{ 'active' if active_page == 'admin' else '' }}">
            <svg class="sidebar-nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none">
                <path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
                      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="sidebar-nav-label">Админ-панель</span>
        </a>
        {% endif %}

        <!-- Доменные элементы (авто-генерация из nav_groups) -->
        {% for group in nav_groups %}
        {% if group.group %}
        <div class="sidebar-nav-group">
            <span class="sidebar-nav-group-label">{{ group.group }}</span>
        </div>
        {% endif %}
        {% for item in group.nav_items %}
        <a href="{{ item.url }}" class="sidebar-nav-item {{ 'active' if active_page == item.active_page else '' }}" title="{{ item.label }}" data-domain="{{ item.chat_domains[0] if item.chat_domains else '' }}">
            <svg class="sidebar-nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none">
                {{ item.icon_svg|safe }}
            </svg>
            <span class="sidebar-nav-label">{{ item.label }}</span>
        </a>
        {% endfor %}
        {% endfor %}
    </nav>

    <div class="sidebar-footer">
        <button class="sidebar-chat-btn" id="sidebarChatBtn" title="AI-Ассистент">
            <svg class="sidebar-nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none">
                <path d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"
                      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="sidebar-nav-label">AI-Ассистент</span>
        </button>
    </div>
</aside>
