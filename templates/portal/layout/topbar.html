<!-- Общий topbar для landing и acts-manager страниц -->
<header class="landing-topbar">
    <h2 class="landing-topbar-title">{{ topbar_title }}</h2>
    <div class="landing-topbar-actions">
        <!-- Колокольчик уведомлений (shared NotificationCenter; те же DOM-id, что в конструкторе) -->
        <div class="notifications-menu-container">
            <button id="notificationsBtn" class="landing-topbar-btn" title="Уведомления" aria-label="Открыть уведомления">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                    <path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"
                          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <span id="notificationsBadge" class="notif-badge hidden">0</span>

            <div id="notificationsMenu" class="notifications-menu hidden">
                <div class="notifications-menu-header">
                    <h4>Уведомления</h4>
                    <div class="notifications-menu-actions">
                        <button id="notificationsReadAllBtn" class="notifications-read-all" type="button">Прочитать все</button>
                        <button id="closeNotificationsBtn" class="notifications-menu-close" aria-label="Закрыть">&times;</button>
                    </div>
                </div>
                <div class="notifications-menu-body" id="notificationsBody"></div>
                <!-- Угловая ручка изменения размера (bottom-left: меню прижато
                     к правому краю, растёт влево и вниз) -->
                <div class="notifications-menu-resize" aria-hidden="true"></div>
            </div>
        </div>
        <button id="landingSettingsBtn" class="landing-topbar-btn" title="Настройки">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
                      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>

        <!-- Профиль пользователя -->
        <div class="topbar-user-profile">
            <div class="topbar-user-avatar">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
                          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <div class="topbar-user-info">
                <div class="topbar-user-name" id="currentUserName">Загрузка...</div>
                <div class="topbar-user-role">Сотрудник</div>
            </div>
        </div>

        {% if auth_enabled %}
        <!-- Выход (только в ОТП-режиме; в тест-режиме авторизации нет) -->
        <a href="/auth/logout" class="landing-topbar-btn" title="Выйти" aria-label="Выйти из системы">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
                      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </a>
        {% endif %}
    </div>
</header>
